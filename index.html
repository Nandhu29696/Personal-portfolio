  <script>
    // Apply the saved theme before React loads so the page doesn't flash.
    try {
      var t = localStorage.theme;
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) { }
  </script>
